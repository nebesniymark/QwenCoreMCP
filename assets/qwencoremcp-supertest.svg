<title id="svgTitle">QwenCoreMCP supertest overview</title>
<desc id="svgDesc">Real-world QwenCoreMCP test with Qwen3.5-4B: editorial overall assessment 91/100, editorial module quality assessment 97/100, both expert judgments rather than measured benchmark scores. Across seven stages, 163 MCP calls included 148 valid tool results, 12 correctly refused negative cases, and 3 model-generated invalid requests later corrected. One unrequested memory write was observed.</desc>
